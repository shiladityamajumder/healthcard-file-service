# =============================================================================
# HEALTHCARE FILE SERVICE
#
# This Compose file starts only the NestJS file-management API.
#
# It does not create or manage:
#
# - PostgreSQL
# - Amazon S3
# - MinIO
# - Bucket initialization jobs
# - Workers or schedulers
#
# PostgreSQL and S3-compatible storage must be reachable through settings in
# .env before the service can become ready.
# =============================================================================

services:
  api:
    # =========================================================================
    # IMAGE BUILD
    # =========================================================================

    build:
      # Use the current project directory as the Docker build context.
      context: .

      # Use the production-oriented Dockerfile in the project root.
      dockerfile: Dockerfile

    # Give the generated image a reusable local name.
    image: healthcare-file-service:latest

    # Give the running container a predictable name.
    container_name: healthcare-file-service

    # =========================================================================
    # PROCESS AND RESTART BEHAVIOR
    # =========================================================================

    # Restart automatically after unexpected process or host failures.
    # Manual stops remain stopped until explicitly started again.
    restart: unless-stopped

    # Give NestJS time to finish requests and close PostgreSQL/S3 clients.
    stop_grace_period: 30s

    # Provide correct signal forwarding and zombie-process cleanup.
    init: true

    # =========================================================================
    # ENVIRONMENT CONFIGURATION
    # =========================================================================

    # Load API settings and external PostgreSQL/S3 credentials from .env.
    # The file is optional for image inspection and must never be committed.
    env_file:
      - path: .env
        required: false

    # =========================================================================
    # PORT MAPPING
    # =========================================================================

    ports:
      # PORT controls both the published host port and NestJS's container
      # listener. The default exposes the API at http://localhost:3000.
      - "${PORT:-3000}:${PORT:-3000}"

    # =========================================================================
    # HEALTH CHECK
    # =========================================================================

    healthcheck:
      # Liveness checks only the NestJS process. Use /health/ready separately
      # when PostgreSQL and object-storage readiness must be verified.
      test:
        - CMD
        - node
        - -e
        - "const port=process.env.PORT||'3000';fetch('http://127.0.0.1:'+port+'/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # =========================================================================
    # SECURITY
    # =========================================================================

    # Prevent the container from gaining additional Linux privileges.
    security_opt:
      - no-new-privileges:true

    # The API does not require Linux capabilities or privileged ports.
    cap_drop:
      - ALL

    # Sharp and standard libraries may require temporary working space.
    tmpfs:
      - /tmp:size=128m,mode=1777

    # =========================================================================
    # LOGGING
    # =========================================================================

    # Prevent Docker JSON log files from growing without limit.
    logging:
      driver: json-file

      options:
        max-size: "10m"
        max-file: "5"

    # =========================================================================
    # RESOURCE LIMITS
    # =========================================================================

    # Image decoding can be memory-intensive. Adjust these limits after
    # measuring representative upload sizes and concurrency.
    mem_limit: 1g
    cpus: 1.0

    # =========================================================================
    # NETWORK
    # =========================================================================

    networks:
      - application-network


# =============================================================================
# APPLICATION NETWORK
# =============================================================================

networks:
  application-network:
    # Private bridge network for this Compose project.
    driver: bridge
